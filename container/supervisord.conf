[supervisord]
nodaemon=true
logfile=/var/www/html/log/supervisor/supervisord.log
childlogdir=/var/www/html/log/supervisor

[program:mysql]
command=/usr/local/bin/mysql-init.sh
autostart=true
autorestart=true
priority=10

[program:drupal]
command=/bin/bash -c 'while [ ! -f /var/www/html/sites/default/settings.php ]; do sleep 5; done; while ! mysql -uroot -e "SELECT 1" 2>/dev/null; do sleep 2; done; cd /var/www/html && /var/www/html/vendor/bin/drush runserver 0.0.0.0:%(ENV_RUNPORT)s'
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/www/html/log/supervisor/drupal.log
stderr_logfile=/var/www/html/log/supervisor/drupal.log
